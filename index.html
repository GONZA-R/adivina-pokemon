<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adivina el Pokémon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: una mesa de juego — barra de estado arriba, tablero de 24 cartas, dock de acciones abajo. Look único tipo consola portátil. */
:root{
  --bg:#13203b; --panel:#1c2c4e; --line:#2d4170; --fg:#eef2fb; --muted:#9fb0d4;
  --card:#fbf4df; --ink:#1d1b2c; --accent:#ffcb05; --red:#e3350d; --ok:#2fae6b;
  --display:"Press Start 2P",ui-monospace,"Courier New",monospace;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
main{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 120px;display:flex;flex-direction:column;gap:18px}
h1,h2,.px{font-family:var(--display);font-weight:400;text-wrap:balance;letter-spacing:.02em}
h1{font-size:clamp(18px,4.2vw,30px);line-height:1.5;margin:0;color:var(--accent);text-shadow:3px 3px 0 #0a1226}
h2{font-size:13px;line-height:1.7;margin:0}
p{margin:0}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:800;background:var(--panel);color:var(--fg);box-shadow:0 4px 0 #0a1226;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0a1226}
.btn.pri{background:var(--accent);color:var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--panel);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
input[type=text],select{background:#0e1830;color:var(--fg);border:2px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0}
input[type=text]{flex:1 1 180px}
#joincode{text-transform:uppercase;font-family:var(--display);font-size:14px;letter-spacing:.2em;flex:0 1 150px}

/* Portada */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:stretch}
.hero .intro{display:flex;flex-direction:column;gap:14px;justify-content:center}
.lineup{display:flex;gap:4px;flex-wrap:wrap}
.lineup img{width:64px;height:64px;image-rendering:pixelated;filter:brightness(0) invert(.85) sepia(1) hue-rotate(10deg) saturate(3);opacity:.9}
.lineup img:nth-child(odd){filter:none}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.rules ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}

/* Barra de estado */
.status{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--panel);border-radius:14px;padding:12px 16px}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 12px;background:#0e1830;font-weight:800;font-size:13px}
.chip.turn{background:var(--accent);color:var(--ink)}
.code{font-family:var(--display);font-size:16px;letter-spacing:.25em;color:var(--accent)}

/* Tablero */
.play{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:860px){.play{grid-template-columns:1fr}}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.card{position:relative;border:0;border-radius:12px;background:var(--card);color:var(--ink);padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 #b9ad8a;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card img{width:80px;height:80px;image-rendering:pixelated;max-width:100%}
.card .nm{font-weight:800;font-size:13px;line-height:1.15;text-align:center}
.card .num{position:absolute;top:6px;left:8px;font-size:10px;font-weight:800;color:#8a8166;font-variant-numeric:tabular-nums}
.tys{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:3px}
.ty{font-size:10px;font-weight:800;color:#fff;border-radius:5px;padding:1px 6px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.card.down{background:#22335a;color:var(--muted);box-shadow:0 4px 0 #0a1226}
.card.down img{opacity:.12;filter:grayscale(1)}
.card.down .tys{opacity:.25}
.card.down::after{content:"";position:absolute;inset:auto;top:22px;width:46px;height:46px;border-radius:50%;
  background:linear-gradient(var(--red) 0 45%,#0a1226 45% 55%,#e9e9e9 55%);box-shadow:inset 0 0 0 3px #0a1226}
.card.sel{outline:4px solid var(--accent);outline-offset:2px}
.card.secret{outline:4px solid var(--ok);outline-offset:2px}
.board.picking .card,.board.guessing .card:not(.down){animation:none}
.board.guessing .card:not(.down){box-shadow:0 4px 0 var(--accent)}

/* Lateral */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.mine{display:flex;gap:12px;align-items:center}
.mine img{width:72px;height:72px;image-rendering:pixelated;background:var(--card);border-radius:10px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto}
.log li{background:#0e1830;border-radius:10px;padding:8px 10px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.log .who{font-weight:800;color:var(--accent);margin-right:4px}
.ans{flex:none;font-weight:800;font-size:12px;border-radius:6px;padding:2px 8px}
.ans.y{background:var(--ok);color:#fff}.ans.n{background:var(--red);color:#fff}.ans.w{background:var(--line);color:var(--muted)}
.ask{border:3px solid var(--accent)}
.ask .q{font-size:18px;font-weight:800}

/* Telón y banner */
.curtain{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;background:repeating-linear-gradient(45deg,var(--panel) 0 18px,#182747 18px 36px);border-radius:18px;padding:30px 16px}
.curtain h2{font-size:clamp(16px,4vw,26px);color:var(--accent)}
.banner{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;background:var(--panel);border-radius:18px;padding:26px 16px}
.banner .pair{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.banner figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.banner figure img{width:112px;height:112px;image-rendering:pixelated;background:var(--card);border-radius:14px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#0b1428ee;border-top:2px solid var(--line);display:flex;justify-content:center;z-index:5}
.dock .row{max-width:1080px;width:100%;justify-content:center}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--accent);color:var(--ink);font-weight:800;padding:10px 16px;border-radius:10px;z-index:9;max-width:calc(100% - 32px)}
.err{color:#ff9b84;font-weight:700}
.gens{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gen{border:0;border-radius:12px;padding:6px 10px 6px 6px;display:flex;align-items:center;gap:8px;text-align:left;background:#0e1830;color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}
.gen img{width:44px;height:44px;image-rendering:pixelated;flex:none;filter:grayscale(1) opacity(.5)}
.gen span{display:flex;flex-direction:column;min-width:0}
.gen b{font-size:14px}
.gen small{font-size:12px}
.gen[aria-pressed=true]{background:var(--accent);color:var(--ink);box-shadow:none}
.gen[aria-pressed=true] img{filter:none}
@media (max-width:600px){.gens{grid-template-columns:repeat(2,minmax(0,1fr))}.gen img{width:36px;height:36px}}

/* Tablet: tablero arriba, panel lateral en dos columnas debajo */
@media (max-width:860px){
  .side{display:grid;grid-template-columns:1fr 1fr;gap:12px;order:-1}
  .side > :first-child{grid-column:1 / -1}
}
/* Celular: 4 cartas por fila para ver el tablero entero de un vistazo */
@media (max-width:600px){
  body{font-size:14px}
  main{gap:12px;padding-block:12px 110px}
  .side{display:contents}
  .side > *{order:1}
  .side > :first-child{order:-1}
  .panel{padding:14px;gap:10px;border-radius:12px}
  .status{padding:10px 12px;gap:8px}
  .status .btn{padding:7px 12px}
  .board{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .card{padding:4px 2px 6px;border-radius:9px;box-shadow:0 3px 0 #b9ad8a}
  .card.down{box-shadow:0 3px 0 #0a1226}
  .card img{width:56px;height:56px}
  .card .nm{font-size:10.5px;overflow-wrap:anywhere}
  .card .num{display:none}
  .tys{gap:2px;margin-top:2px}
  .ty{font-size:8.5px;padding:0 4px;border-radius:4px}
  .card.down::after{top:12px;width:34px;height:34px}
  .mine img{width:56px;height:56px}
  .log{max-height:200px}
  .dock{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
  .dock .btn{padding:11px 14px;flex:1 1 auto}
  .dock .row > span{flex:1 1 100%;text-align:center}
  .lineup img{width:44px;height:44px}
  .banner figure img{width:88px;height:88px}
}
@media (max-width:360px){
  .board{grid-template-columns:repeat(3,minmax(0,1fr))}
}
/* Preguntas rápidas */
.btn.mini{padding:6px 10px;font-size:13px;box-shadow:none;align-self:flex-start}
.qtabs{display:flex;flex-wrap:wrap;gap:6px}
.qtab,.seg button{border:0;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;background:#0e1830;color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}
.qtab[aria-selected=true],.seg button[aria-pressed=true]{background:var(--accent);color:var(--ink);box-shadow:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qk{border:0;border-radius:9px;padding:7px 10px;font-weight:800;font-size:13px;background:#0e1830;color:var(--fg);box-shadow:inset 0 0 0 2px var(--line);display:inline-flex;align-items:center;gap:6px;transition:transform .08s}
.qk:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.qk:active{transform:scale(.95)}
.qk.flojo{opacity:.45}
.qk.hecha{text-decoration:line-through;opacity:.4}
.qk .dot{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.resp{font-family:var(--display);font-size:24px;line-height:1.3}
.resp.y{color:var(--ok)}.resp.n{color:#ff6b4a}
.log .btn.mini{margin-top:6px}
.chip.warn{background:var(--red);color:#fff;animation:late 1s steps(2) infinite}
@keyframes late{50%{opacity:.6}}
.opts .opt{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.opts .opt > .muted{min-width:130px;font-weight:700}

.niveles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:860px){.niveles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.nivel{border:0;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-align:left;background:#0e1830;color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}
.nivel b{font-family:var(--display);font-weight:400;font-size:11px;color:var(--fg)}
.nivel span{font-weight:800}
.nivel small{font-size:12.5px;line-height:1.35}
.nivel[aria-pressed=true]{background:var(--accent);color:var(--ink);box-shadow:none}
.nivel[aria-pressed=true] b{color:var(--ink)}
@media (max-width:600px){.niveles{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Historial */
.stats{display:flex;flex-wrap:wrap;gap:8px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hist li{display:flex;align-items:center;gap:8px;background:#0e1830;border-radius:10px;padding:6px 10px}
.hist img{width:40px;height:40px;image-rendering:pixelated;flex:none}
.hist img + img{margin-left:-10px}
.hist .r{margin-left:auto;font-size:12px;text-align:right;flex:none}

/* Animaciones (--t guarda cuánto hace que empezaron, así no se reinician al redibujar) */
@keyframes voltear{0%{transform:perspective(500px) rotateY(0)}45%,55%{transform:perspective(500px) rotateY(90deg)}100%{transform:perspective(500px) rotateY(0)}}
.card.flip{animation:voltear .42s ease both;animation-delay:var(--t,0ms)}
@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.03)}100%{transform:none;opacity:1}}
.pop{animation:pop .4s ease both;animation-delay:var(--t,0ms)}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.curtain{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.banner{position:relative;overflow:hidden}
.reveal .guessed img{animation:silueta 2.4s ease both;animation-delay:var(--t,0ms)}
@keyframes silueta{0%,50%{filter:brightness(0);transform:scale(.92)}62%{filter:brightness(2.6);transform:scale(1.1)}100%{filter:none;transform:none}}
.reveal .guessed figcaption,.reveal .wtitle{animation:aparece 2.4s ease both;animation-delay:var(--t,0ms)}
@keyframes aparece{0%,58%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
.reveal .wtp{animation:wtp 2.4s ease both;animation-delay:var(--t,0ms)}
@keyframes wtp{0%{opacity:0;transform:scale(.8)}12%,55%{opacity:1;transform:none}100%{opacity:.55}}
.confeti{position:absolute;inset:0;pointer-events:none}
.confeti i{position:absolute;top:-14px;width:8px;height:12px;border-radius:2px;opacity:0;animation:cae 2.8s ease-in both;animation-delay:calc(var(--t,0ms) + var(--d,1.4s))}
@keyframes cae{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(460px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<main id="app" aria-live="polite"></main>
<div id="toast" class="toast" hidden></div>

/* Base de datos de prueba: fuera de claude.ai guarda las partidas en el navegador,
   así se puede probar el modo online con dos pestañas de la misma PC. */
function localDB(){
  const K = p => "aepdb:" + p, subs = new Map();
  const read = p => { try { const v = localStorage.getItem(K(p)); return v ? JSON.parse(v) : null; } catch (e) { return null; } };
  const snap = (p, d) => ({id:p.split("/").pop(), exists:!!d, data:() => d || undefined, metadata:{fromCache:false, hasPendingWrites:false}});
  const fire = p => (subs.get(p) || []).forEach(fn => fn(snap(p, read(p))));
  const put = (p, d) => { localStorage.setItem(K(p), JSON.stringify(d)); setTimeout(() => fire(p), 0); };
  window.addEventListener("storage", e => { if (e.key && e.key.startsWith("aepdb:")) fire(e.key.slice(6)); });
  const doc = p => ({
    id:p.split("/").pop(), path:p,
    get:async () => snap(p, read(p)),
    set:async d => put(p, JSON.parse(JSON.stringify(d))),
    update:async d => { const cur = read(p); if (!cur) throw {code:"invalid_argument", message:"no existe"}; put(p, {...cur, ...JSON.parse(JSON.stringify(d))}); },
    delete:async () => { localStorage.removeItem(K(p)); setTimeout(() => fire(p), 0); },
    onSnapshot:(next) => { if (!subs.has(p)) subs.set(p, []); subs.get(p).push(next); setTimeout(() => next(snap(p, read(p))), 0); return () => subs.set(p, subs.get(p).filter(f => f !== next)); },
  });
  return {doc, collection:c => ({path:c, doc:id => doc(c + "/" + id)})};
}

function cargarScript(src){ return new Promise((ok, mal) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = mal; document.head.appendChild(s); }); }
async function firebaseDB(){
  const V = "https://www.gstatic.com/firebasejs/10.12.2/";
  for (const f of ["firebase-app-compat.js", "firebase-auth-compat.js", "firebase-database-compat.js"]) await cargarScript(V + f);
  firebase.initializeApp(FIREBASE_CONFIG);
  const cred = firebase.auth().currentUser || await new Promise(ok => { const off = firebase.auth().onAuthStateChanged(u => { off(); ok(u); }); });
  const yo = cred || (await firebase.auth().signInAnonymously()).user;
  const rt = firebase.database();
  // Realtime Database borra los null y los arreglos vacíos: los repongo al leer.
  const norm = v => {
    if (!v) return null;
    const d = {...v};
    if (d.log) d.log = Object.values(d.log).map(e => ({a:null, ...e}));
    if (d.flip) d.flip = Object.values(d.flip);
    return d;
  };
  const snap = (p, v) => ({id:p.split("/").pop(), exists:v != null, data:() => v || undefined, metadata:{fromCache:false, hasPendingWrites:false}});
  const fail = e => { throw {code: /permission/i.test(String(e && (e.code || e.message))) ? "invalid_argument" : "unavailable", message:String(e)}; };
  const doc = p => ({
    id:p.split("/").pop(), path:p,
    get:() => rt.ref(p).get().then(s => snap(p, norm(s.val())), fail),
    set:d => rt.ref(p).set(JSON.parse(JSON.stringify(d))).catch(fail),
    update:async d => { const s = await rt.ref(p).get(); if (!s.exists()) throw {code:"invalid_argument", message:"no existe"}; return rt.ref(p).update(JSON.parse(JSON.stringify(d))).catch(fail); },
    delete:() => rt.ref(p).remove().catch(fail),
    onSnapshot:(next, err) => { const h = s => next(snap(p, norm(s.val()))); rt.ref(p).on("value", h, e => err && err({code:"revoked", message:String(e)})); return () => rt.ref(p).off("value", h); },
  });
  return {db:{doc, collection:c => ({path:c, doc:id => doc(c + "/" + id)})}, uid:yo.uid};
}

    case "s": { const f = FORMAS.find(x => x[0] === b); return !!f && f[3].includes(p.s); }
    case "h": return p.h > +b;   // en decímetros
    case "w": return p.w > +b;   // en hectogramos
  }
  return false;
}
function textoQ(k){
  const [a, b] = k.split(":");
  switch (a){
    case "t": return "¿Es de tipo " + TIPOS[b] + "?";
    case "dos": return "¿Tiene dos tipos?";
    case "c": return "¿Es de color " + COLORES[b] + "?";
    case "g": { const g = GENS.find(x => x.n === +b); return "¿Es de la Gen " + b + " (" + (g ? g.region : "") + ")?"; }
    case "leg": return "¿Es legendario o mítico?";
    case "pre": return "¿Evolucionó de otro Pokémon?";
    case "evo": return "¿Puede evolucionar todavía?";
    case "s": return (FORMAS.find(x => x[0] === b) || [])[1] || k;
    case "h": return "¿Mide más de " + ALTO[b] + "?";
    case "w": return "¿Pesa más de " + PESO[b] + "?";
  }
  return k;
}
function etiquetaQ(k){
  const [a, b] = k.split(":");
  switch (a){
    case "t": return TIPOS[b];
    case "dos": return "Dos tipos";
    case "c": return cap(COLORES[b]);
    case "g": return "Gen " + b;
    case "leg": return "Legendario";
    case "pre": return "Es evolución";
    case "evo": return "Puede evolucionar";
    case "s": return (FORMAS.find(x => x[0] === b) || [])[2] || k;
    case "h": return "Mide + de " + ALTO[b];
    case "w": return "Pesa + de " + PESO[b];
  }
  return k;
}
function dotQ(k){
  const [a, b] = k.split(":");
  if (a === "t") return `<span class="dot" style="background:${TCOL[b]}"></span>`;
  if (a === "c") return `<span class="dot" style="background:${CCOL[b]}"></span>`;
  return "";
}
function preguntasPara(board, nv){
  const tipos = [...new Set(board.flatMap(id => BY[id].t))].sort((a, b) => TIPOS[a].localeCompare(TIPOS[b]));
  const cols = [...new Set(board.map(id => BY[id].c))].sort((a, b) => COLORES[a].localeCompare(COLORES[b]));
  const gs = [...new Set(board.map(id => genOf(id).n))].sort((a, b) => a - b);
  return [
    {cat:"Tipo", items:[...tipos.map(t => "t:" + t), "dos"]},
    {cat:"Color", items:cols.map(c => "c:" + c)},
    {cat:"Forma", items:FORMAS.filter(f => board.some(id => f[3].includes(BY[id].s))).map(f => "s:" + f[0])},
    {cat:"Tamaño", items:["h:5", "h:10", "h:20", "w:100", "w:500", "w:1000"]},
    {cat:"Evolución", items:["pre", "evo", "leg"]},

}

/* ---------- sonidos (sintetizados, sin archivos) y gritos de PokeAPI ---------- */
let SND = true; try { SND = localStorage.getItem("aep_snd") !== "0"; } catch (e) {}
let AC = null;
function tono(f, d, tipo = "square", vol = .05, t0 = 0, f2 = null){
  const t = AC.currentTime + t0, o = AC.createOscillator(), g = AC.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
}
const melodia = (ns, d, tipo, vol) => ns.forEach((f, i) => tono(f, d * 1.1, tipo, vol, i * d));
const SFX = {
  flip: () => tono(520, .07, "square", .04, 0, 240),
  up: () => tono(260, .07, "square", .04, 0, 560),
  sel: () => tono(880, .05, "square", .035),
  ask: () => { tono(660, .07, "square", .045); tono(880, .09, "square", .045, .08); },
  yes: () => melodia([523, 659, 784], .09, "square", .05),
  no: () => { tono(330, .12, "sawtooth", .04); tono(220, .2, "sawtooth", .04, .13); },
  turn: () => { tono(392, .07, "triangle", .08); tono(587, .1, "triangle", .08, .08); },
  tick: () => tono(1200, .03, "square", .03),
  win: () => melodia([523, 659, 784, 1047, 784, 1047], .11, "square", .05),
  lose: () => melodia([392, 330, 262, 196], .16, "triangle", .08),
};
function sfx(n){
  if (!SND) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); SFX[n] && SFX[n](); } catch (e) {}
}
function grito(id){
  if (!SND || !id) return;
  try { const a = new Audio("https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/" + id + ".ogg"); a.volume = .3; a.play().catch(() => {}); } catch (e) {}
}

// La PC busca la pregunta que parte sus cartas en pie lo más cerca posible de la mitad
function pcJuega(){
  const cands = L.board.filter(id => !L.flip[2].includes(id));
  const usadas = new Set(L.log.filter(e => e.by === 2 && e.qk).map(e => e.qk));
  const qs = preguntasPara(L.board, L.nivel).flatMap(c => c.items).filter(k => !usadas.has(k))
    .map(k => { const y = cands.filter(id => cumple(id, k)).length; return {k, s:Math.min(y, cands.length - y)}; })
    .filter(x => x.s > 0).sort((a, b) => b.s - a.s);
  const azar = arr => arr[Math.floor(Math.random() * arr.length)];
  let guess = null, q = null;
  if (cands.length === 1 || !qs.length) guess = azar(cands);
  else if (L.dif === "facil" && cands.length <= 4 && Math.random() < .5) guess = azar(cands);
  else if (L.dif === "facil") q = azar(qs).k;
  else if (L.dif === "normal") q = azar(qs.slice(0, 3)).k;
  else q = azar(qs.filter(x => x.s === qs[0].s)).k;
  if (guess){
    const ok = guess === L.secret[1];
    L.log.push({by:2, k:"g", id:guess, a:ok});
    if (ok){ finLocal(2); render(); return; }
    L.flip[2].push(guess); toast("La PC arriesgó " + nombre(guess) + " y no era.");
    sfx("yes");
  } else {
    const a = cumple(L.secret[1], q), fuera = sobran(L.board, L.flip[2], q, a);
    L.flip[2].push(...fuera);
    L.log.push({by:2, k:"q", qk:q, t:textoQ(q), a, n:fuera.length});
    sfx("ask");
  }
  L.cur = 1; L.thinking = false; L.turnAt = Date.now();
  setTimeout(() => sfx("turn"), 250);
  render();
}

/* ---------- temporizador de turno ---------- */
function relojInfo(){
  if (S.view === "local" && L && L.timer && L.phase === "play" && !L.curtain && !L.asked && !(L.pc && L.cur === 2) && L.turnAt)
    return {limit:L.timer, start:L.turnAt, fin:() => {
      if (L._to === L.turnAt) return; L._to = L.turnAt;
      L.log.push({by:L.cur, k:"t", a:true});
      toast("¡Se acabó el tiempo" + (L.pc ? "! Perdés el turno." : " de " + nombreJ(L.cur) + "! Pierde el turno.")); sfx("no");
      if (!L.pc) L.msg = nombreJ(L.cur) + " se quedó sin tiempo.";
      terminarTurno();
    }};
  if (S.view === "online" && O && O.g && O.g.timer && O.turnStart){
    const g = O.g, me = meN(), log = g.log || [], last = log[log.length - 1];
    if (phaseOf(g) !== "playing" || g.turn !== me || (last && last.a === null)) return null;
    return {limit:g.timer, start:O.turnStart, fin:() => {
      const k = "t" + log.length; if (O.done[k]) return; O.done[k] = true;

      write(() => gameRef(O.code).update({turn:otro(me), log:[...log, {by:me, k:"t", a:true}]}));
    }};
  }
  return null;
}
const restante = r => Math.max(0, Math.ceil(r.limit - (Date.now() - r.start) / 1000));
const relojChip = r => { const s = restante(r); return `<span class="chip${s <= 10 ? " warn" : ""}" id="clock">⏱ ${fmt(s)}</span>`; };
let ultSeg = null;
setInterval(() => {
  const r = relojInfo(); if (!r){ ultSeg = null; return; }
  const s = restante(r), el = document.getElementById("clock");
  if (el){ el.textContent = "⏱ " + fmt(s); el.classList.toggle("warn", s <= 10); }
  if (s !== ultSeg && s <= 5 && s > 0) sfx("tick");
  ultSeg = s;
  if (s <= 0) r.fin();
}, 250);

function genCode(){ const a = "ABCDEFGHJKLMNPQRSTUVWXYZ"; let s = ""; for (let i = 0; i < 4; i++) s += a[Math.floor(Math.random()*a.length)]; return s; }

async function createOnline(){

async function joinOnline(raw){
  const code = (raw || "").trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(code)){ S.joinErr = "El código tiene 4 letras."; render(); return; }
  S.busy = true; S.joinErr = ""; render();
  try {
    const s = await gameRef(code).get();
    if (!s.exists) S.joinErr = "No encontré la partida " + code + ".";
    else {
      const d = s.data();
      if (d.p1 === uid || d.p2 === uid) await enterOnline(code);
      else if (!d.p2){ await gameRef(code).update({p2:uid, n2:S.names[1] || ""}); await enterOnline(code); }
      else S.joinErr = "La partida " + code + " ya tiene dos jugadores.";
    }
  } catch (e) { S.joinErr = e && e.code === "invalid_argument" ? "Tu cuenta no tiene permiso para jugar online en esta página. Pedile al dueño acceso de Editor." : "No se pudo entrar a la partida."; }
  S.busy = false; render();
}
async function enterOnline(code){

      q:log.filter(e => e.k === "q").length, s:Math.round((Date.now() - (g.created || Date.now())) / 1000)});

  const dock = O.guessMode ? `<div class="dock"><div class="row">${O.sel
      ? `<span>¿Es <b>${esc(nombre(O.sel))}</b>?</span><button class="btn red" data-act="oguess">Sí, adivinar</button><button class="btn ghost" data-act="cancelguess">Cancelar</button>`
      : `<span>Tocá el Pokémon que creés que tiene ${esc(who(riv))}.</span><button class="btn ghost" data-act="cancelguess">Cancelar</button>`}</div></div>` : "";
  return top + `<div class="play"><div>${boardHTML(g.board, id => ({down: flips.includes(id), sel: O.guessMode && O.sel === id}), O.guessMode ? "guessing" : "")}
      <p class="muted" style="margin-top:10px">Te quedan ${quedan} en pie. Tocá una carta para bajarla o levantarla.</p></div>
    <aside class="side">${action}${mineHTML(O.priv.secret)}
      <div class="panel"><h2>Preguntas</h2>${items ? `<ul class="log">${items}</ul>` : `<p class="muted">Todavía nadie preguntó nada.</p>`}</div></aside></div>${dock}`;
}

/* ---------- render y eventos ---------- */
function render(){
  const a = document.activeElement, fid = a && a.id, s0 = a && a.selectionStart, s1 = a && a.selectionEnd;
  $app.innerHTML = S.view === "local" ? localHTML() : S.view === "online" && O ? onlineHTML() : homeHTML();
  if (fid){ const n = document.getElementById(fid); if (n && n.focus){ n.focus(); try { n.setSelectionRange(s0, s1); } catch (e) {} } }
  if (genPend.size) cargarSprites();
}

$app.addEventListener("input", e => {
  if (e.target.id === "q" && O) O.draft = e.target.value;
  if (e.target.id === "name1" || e.target.id === "name2"){ S.names[e.target.id.slice(-1)] = e.target.value.trim().slice(0, 16); guardar("aep_names", S.names); }
});
$app.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "joincode") joinOnline(e.target.value);
  if (e.target.id === "q") act("ask");
});
$app.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  act(t.dataset.act, t);
});

function act(a, t){
  const id = t && t.dataset.id ? +t.dataset.id : null;
  switch (a){
    case "home": clearTimeout(pcT); if (O) return leaveOnline(); S.view = "home"; L = null; render(); window.scrollTo(0, 0); break;
    case "local": newLocal(false); break;
    case "pc": newLocal(true); break;
    case "again": newLocal(L ? L.pc : false); break;
    case "dif": S.dif = t.dataset.v; guardar("aep_dif", S.dif); render(); break;
    case "nivel": S.nivel = +t.dataset.v; guardar("aep_nivel", S.nivel); sfx("sel"); render(); break;
    case "timer": S.timer = +t.dataset.v; guardar("aep_timer", S.timer); render(); break;
    case "snd": case "mute":
      SND = a === "snd" ? t.dataset.v === "1" : !SND;
      try { localStorage.setItem("aep_snd", SND ? "1" : "0"); } catch (e) {}
      if (SND) sfx("sel"); render(); break;
    case "clearhist":
      if (!confirm("¿Borrar todo el historial de partidas de este dispositivo?")) return;
      HIST = []; guardar("aep_hist", HIST); render(); break;
    case "gen": case "gens-all": case "gens-none": {
      if (a === "gens-all") gens = gens.length === GENS.length ? [1] : GENS.map(g => g.n);   // alterna: todas ↔ solo Gen 1 (siempre queda una)
      else if (a === "gens-none") gens = [1];
      else {
        const n = +t.dataset.g;
        if (gens.includes(n)){ if (gens.length === 1){ toast("Tiene que quedar al menos una generación."); return; } gens = gens.filter(x => x !== n); }
        else gens = [...gens, n].sort((x, y) => x - y);
      }
      try { localStorage.setItem("aep_gens2", JSON.stringify(gens)); } catch (e) {}
      render(); break;
    }
    case "create": createOnline(); break;
    case "join": joinOnline((document.getElementById("joincode") || {}).value); break;
    case "resume": S.busy = true; render(); joinOnline(S.resume).then(() => { if (S.view === "home"){ S.resume = null; try { localStorage.removeItem("aep_code"); } catch (e) {} render(); } }); break;
    case "leave": leaveOnline(); break;
    case "copy": {
      const code = O.code;
      Promise.resolve().then(() => navigator.clipboard.writeText(code)).then(() => toast("Código copiado: " + code), () => toast("Copiá el código a mano: " + code));
      break;
    }
    case "qcat": S.qcat = t.dataset.c; render(); break;
    case "quick": {
      const k = t.dataset.k;
      if (S.view === "local"){
        if (L.phase !== "play" || (L.pc && L.cur === 2)) return;
        if (L.asked){ toast("Ya preguntaste en este turno."); return; }
        const c = L.cur, ans = cumple(L.secret[otro(c)], k);
        L.log.push({by:c, k:"q", qk:k, t:textoQ(k), a:ans}); L.asked = true; L.askedAt = Date.now();
        sfx(ans ? "yes" : "no"); render();
      } else {
        const g = O.g, me = meN(), log = g.log || [], last = log[log.length - 1];
        if (g.turn !== me || (last && last.a === null)) return;
        sfx("ask");
        write(() => gameRef(O.code).update({log:[...log, {by:me, k:"q", qk:k, t:textoQ(k), a:null}]}));
      }
      break;
    }
    case "autoflip": {
      const k = t.dataset.k, v = t.dataset.v === "1";
      const board = S.view === "local" ? L.board : O.g.board;
      const flips = S.view === "local" ? L.flip[L.pc ? 1 : L.cur] : O.priv.flip;
      const fuera = sobran(board, flips, k, v); if (!fuera.length) return;
      flips.push(...fuera); marcarAnim(fuera); sfx("flip");
      if (S.view === "online") savePriv();
      render(); break;
    }
    case "uncurtain": L.curtain = false; L.msg = ""; L.sel = null; L.turnAt = Date.now(); sfx("turn"); render(); break;
    case "card": onCard(id); break;
    case "lpick":
      if (!L.sel) return;
      sfx("sel");
      if (L.pc){
        L.secret[1] = L.sel; L.secret[2] = L.board[Math.floor(Math.random() * L.board.length)];
        grito(L.sel); L.sel = null; L.phase = "play"; L.cur = 1; L.turnAt = Date.now(); render(); window.scrollTo(0, 0); break;
      }
      L.secret[L.cur] = L.sel; L.sel = null;
      if (L.cur === 1){ L.cur = 2; } else { L.cur = 1; L.phase = "play"; }
      L.curtain = true; render(); break;
    case "lend": terminarTurno(); break;
    case "guessmode": if (S.view === "local"){ L.guessMode = true; L.sel = null; } else { O.guessMode = true; O.sel = null; } render(); break;
    case "cancelguess": if (S.view === "local"){ L.guessMode = false; L.sel = null; } else { O.guessMode = false; O.sel = null; } render(); break;
    case "lguess": {
      const g = L.sel, c = L.cur; if (!g) return;
      L.guessMode = false; L.sel = null;
      const ok = g === L.secret[otro(c)];
      L.log.push({by:c, k:"g", id:g, a:ok});
      if (ok){ finLocal(c); render(); window.scrollTo(0, 0); break; }
      if (!L.flip[c].includes(g)) L.flip[c].push(g);
      marcarAnim([g]); sfx("no");
      if (L.pc) toast("No era " + nombre(g) + ". Perdés el turno.");
      else L.msg = nombreJ(c) + " arriesgó " + nombre(g) + " y no era. Pierde el turno.";
      terminarTurno(); break;
    }
    case "opick": {
      const me = meN(), sel = O.sel, code = O.code; if (!sel) return;
      O.priv = {secret:sel, flip:[]}; O.sel = null; sfx("sel"); grito(sel);
      write(() => privRef(code).set({secret:sel, flip:[]})).then(() => write(() => gameRef(code).update({["ready" + me]:true})));
      render(); break;
    }
    case "ask": {
      const txt = (O.draft || "").trim(); if (!txt){ toast("Escribí una pregunta primero."); return; }
      const g = O.g, me = meN(); if (g.turn !== me) return;
      O.draft = ""; sfx("ask");
      write(() => gameRef(O.code).update({log:[...(g.log || []), {by:me, k:"q", t:txt.slice(0, 140), a:null}]}));
      render(); break;
    }
    case "ans": {
      const g = O.g, me = meN(), log = g.log || [], i = log.length - 1;
      if (!log[i] || log[i].a !== null || log[i].by === me) return;
      const nl = log.map((e, j) => j === i ? {...e, a: t.dataset.v === "1"} : e);
      write(() => gameRef(O.code).update({log:nl, turn:me})); break;
    }
    case "oguess": {
      const g = O.g, me = meN(), sel = O.sel; if (!sel || g.turn !== me) return;
      O.guessMode = false; O.sel = null; sfx("ask");
      write(() => gameRef(O.code).update({log:[...(g.log || []), {by:me, k:"g", id:sel, a:null}]}));
      render(); break;
    }
  }
}

function onCard(id){
  if (S.view === "local"){
    if (L.phase === "pick" || L.guessMode){ if (L.guessMode && L.flip[L.pc ? 1 : L.cur].includes(id)) return; L.sel = id; sfx("sel"); render(); return; }
    if (L.phase !== "play" || (L.pc && L.cur === 2)) return;
    const f = L.flip[L.pc ? 1 : L.cur], i = f.indexOf(id); i >= 0 ? f.splice(i, 1) : f.push(id);
    marcarAnim([id]); sfx(i >= 0 ? "up" : "flip"); render(); return;
  }
  if (!O || !O.g) return;
  const ph = phaseOf(O.g);
  if (ph === "choosing" && !O.g["ready" + meN()]){ O.sel = id; sfx("sel"); render(); return; }
  if (ph !== "playing") return;
  if (O.guessMode){ if (!O.priv.flip.includes(id)) { O.sel = id; sfx("sel"); render(); } return; }
  const f = O.priv.flip, i = f.indexOf(id); i >= 0 ? f.splice(i, 1) : f.push(id);
  marcarAnim([id]); sfx(i >= 0 ? "up" : "flip"); savePriv(); render();
}

render();
</script>
