<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Adivina el Pokémon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: una mesa de juego — barra de estado arriba, tablero de 24 cartas, dock de acciones abajo. Look único tipo consola portátil. */
:root{
  --bg:#13203b; --panel:#1c2c4e; --line:#2d4170; --fg:#eef2fb; --muted:#9fb0d4;
  --card:#fbf4df; --ink:#1d1b2c; --accent:#ffcb05; --red:#e3350d; --ok:#2fae6b;
  --display:"Press Start 2P",ui-monospace,"Courier New",monospace;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
main{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 120px;display:flex;flex-direction:column;gap:18px}
h1,h2,.px{font-family:var(--display);font-weight:400;text-wrap:balance;letter-spacing:.02em}
h1{font-size:clamp(18px,4.2vw,30px);line-height:1.5;margin:0;color:var(--accent);text-shadow:3px 3px 0 #0a1226}
h2{font-size:13px;line-height:1.7;margin:0}
p{margin:0}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:800;background:var(--panel);color:var(--fg);box-shadow:0 4px 0 #0a1226;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0a1226}
.btn.pri{background:var(--accent);color:var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--panel);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
input[type=text],select{background:#0e1830;color:var(--fg);border:2px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0}
input[type=text]{flex:1 1 180px}
#joincode{text-transform:uppercase;font-family:var(--display);font-size:14px;letter-spacing:.2em;flex:0 1 150px}

/* Portada */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:stretch}
.hero .intro{display:flex;flex-direction:column;gap:14px;justify-content:center}
.lineup{display:flex;gap:4px;flex-wrap:wrap}
.lineup img{width:64px;height:64px;image-rendering:pixelated;filter:brightness(0) invert(.85) sepia(1) hue-rotate(10deg) saturate(3);opacity:.9}
.lineup img:nth-child(odd){filter:none}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.rules ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
@media (max-width:760px){.hero,.modes{grid-template-columns:1fr}}

/* Barra de estado */
.status{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--panel);border-radius:14px;padding:12px 16px}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 12px;background:#0e1830;font-weight:800;font-size:13px}
.chip.turn{background:var(--accent);color:var(--ink)}
.code{font-family:var(--display);font-size:16px;letter-spacing:.25em;color:var(--accent)}

/* Tablero */
.play{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:860px){.play{grid-template-columns:1fr}}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.card{position:relative;border:0;border-radius:12px;background:var(--card);color:var(--ink);padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 #b9ad8a;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card img{width:80px;height:80px;image-rendering:pixelated;max-width:100%}
.card .nm{font-weight:800;font-size:13px;line-height:1.15;text-align:center}
.card .num{position:absolute;top:6px;left:8px;font-size:10px;font-weight:800;color:#8a8166;font-variant-numeric:tabular-nums}
.tys{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:3px}
.ty{font-size:10px;font-weight:800;color:#fff;border-radius:5px;padding:1px 6px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.card.down{background:#22335a;color:var(--muted);box-shadow:0 4px 0 #0a1226}
.card.down img{opacity:.12;filter:grayscale(1)}
.card.down .tys{opacity:.25}
.card.down::after{content:"";position:absolute;inset:auto;top:22px;width:46px;height:46px;border-radius:50%;
  background:linear-gradient(var(--red) 0 45%,#0a1226 45% 55%,#e9e9e9 55%);box-shadow:inset 0 0 0 3px #0a1226}
.card.sel{outline:4px solid var(--accent);outline-offset:2px}
.card.secret{outline:4px solid var(--ok);outline-offset:2px}
.board.picking .card,.board.guessing .card:not(.down){animation:none}
.board.guessing .card:not(.down){box-shadow:0 4px 0 var(--accent)}

/* Lateral */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.mine{display:flex;gap:12px;align-items:center}
.mine img{width:72px;height:72px;image-rendering:pixelated;background:var(--card);border-radius:10px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto}
.log li{background:#0e1830;border-radius:10px;padding:8px 10px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.log .who{font-weight:800;color:var(--accent);margin-right:4px}
.ans{flex:none;font-weight:800;font-size:12px;border-radius:6px;padding:2px 8px}
.ans.y{background:var(--ok);color:#fff}.ans.n{background:var(--red);color:#fff}.ans.w{background:var(--line);color:var(--muted)}
.ask{border:3px solid var(--accent)}
.ask .q{font-size:18px;font-weight:800}

/* Telón y banner */
.curtain{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;background:repeating-linear-gradient(45deg,var(--panel) 0 18px,#182747 18px 36px);border-radius:18px;padding:30px 16px}
.curtain h2{font-size:clamp(16px,4vw,26px);color:var(--accent)}
.banner{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;background:var(--panel);border-radius:18px;padding:26px 16px}
.banner .pair{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.banner figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.banner figure img{width:112px;height:112px;image-rendering:pixelated;background:var(--card);border-radius:14px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#0b1428ee;border-top:2px solid var(--line);display:flex;justify-content:center;z-index:5}
.dock .row{max-width:1080px;width:100%;justify-content:center}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--accent);color:var(--ink);font-weight:800;padding:10px 16px;border-radius:10px;z-index:9;max-width:calc(100% - 32px)}
.err{color:#ff9b84;font-weight:700}
.gens{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gen{border:0;border-radius:12px;padding:6px 10px 6px 6px;display:flex;align-items:center;gap:8px;text-align:left;background:#0e1830;color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}
.gen img{width:44px;height:44px;image-rendering:pixelated;flex:none;filter:grayscale(1) opacity(.5)}
.gen span{display:flex;flex-direction:column;min-width:0}
.gen b{font-size:14px}
.gen small{font-size:12px}
.gen[aria-pressed=true]{background:var(--accent);color:var(--ink);box-shadow:none}
.gen[aria-pressed=true] img{filter:none}
@media (max-width:600px){.gens{grid-template-columns:repeat(2,minmax(0,1fr))}.gen img{width:36px;height:36px}}

/* Tablet: tablero arriba, panel lateral en dos columnas debajo */
@media (max-width:860px){
  .side{display:grid;grid-template-columns:1fr 1fr;gap:12px;order:-1}
  .side > :first-child{grid-column:1 / -1}
}
/* Celular: 4 cartas por fila para ver el tablero entero de un vistazo */
@media (max-width:600px){
  body{font-size:14px}
  main{gap:12px;padding-block:12px 110px}
  .side{grid-template-columns:1fr}
  .panel{padding:14px;gap:10px;border-radius:12px}
  .status{padding:10px 12px;gap:8px}
  .status .btn{padding:7px 12px}
  .board{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .card{padding:4px 2px 6px;border-radius:9px;box-shadow:0 3px 0 #b9ad8a}
  .card.down{box-shadow:0 3px 0 #0a1226}
  .card img{width:56px;height:56px}
  .card .nm{font-size:10.5px;overflow-wrap:anywhere}
  .card .num{display:none}
  .tys{gap:2px;margin-top:2px}
  .ty{font-size:8.5px;padding:0 4px;border-radius:4px}
  .card.down::after{top:12px;width:34px;height:34px}
  .mine img{width:56px;height:56px}
  .log{max-height:200px}
  .dock{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
  .dock .btn{padding:11px 14px;flex:1 1 auto}
  .dock .row > span{flex:1 1 100%;text-align:center}
  .lineup img{width:44px;height:44px}
  .banner figure img{width:88px;height:88px}
}
@media (max-width:360px){
  .board{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const genPend = new Set(), genLoaded = new Set();
function spr(id){
  if (SPR[id]) return SPR[id];
  const g = genOf(id); if (g && !genLoaded.has(g.n)) genPend.add(g.n);
  return BLANK;
}
function cargarSprites(){
  const lista = [...genPend]; genPend.clear();
  lista.forEach(n => {
    genLoaded.add(n);
    fetch("g/g" + n + ".json").then(r => { if (!r.ok) throw r.status; return r.json(); })
      .then(m => { Object.assign(SPR, m); render(); })
      .catch(() => { genLoaded.delete(n); setTimeout(render, 3000); });
  });
}

/* Base de datos de prueba: fuera de claude.ai guarda las partidas en el navegador,
   así se puede probar el modo online con dos pestañas de la misma PC. */
function localDB(){
  const K = p => "aepdb:" + p, subs = new Map();
  const read = p => { try { const v = localStorage.getItem(K(p)); return v ? JSON.parse(v) : null; } catch (e) { return null; } };
  const snap = (p, d) => ({id:p.split("/").pop(), exists:!!d, data:() => d || undefined, metadata:{fromCache:false, hasPendingWrites:false}});
  const fire = p => (subs.get(p) || []).forEach(fn => fn(snap(p, read(p))));
  const put = (p, d) => { localStorage.setItem(K(p), JSON.stringify(d)); setTimeout(() => fire(p), 0); };
  window.addEventListener("storage", e => { if (e.key && e.key.startsWith("aepdb:")) fire(e.key.slice(6)); });
  const doc = p => ({
    id:p.split("/").pop(), path:p,
    get:async () => snap(p, read(p)),
    set:async d => put(p, JSON.parse(JSON.stringify(d))),
    update:async d => { const cur = read(p); if (!cur) throw {code:"invalid_argument", message:"no existe"}; put(p, {...cur, ...JSON.parse(JSON.stringify(d))}); },
    delete:async () => { localStorage.removeItem(K(p)); setTimeout(() => fire(p), 0); },
    onSnapshot:(next) => { if (!subs.has(p)) subs.set(p, []); subs.get(p).push(next); setTimeout(() => next(snap(p, read(p))), 0); return () => subs.set(p, subs.get(p).filter(f => f !== next)); },
  });
  return {doc, collection:c => ({path:c, doc:id => doc(c + "/" + id)})};
}
/* Modo online fuera de claude.ai: Firebase Realtime Database con usuario anónimo.
   Pegá acá la configuración web de tu proyecto de Firebase para activarlo. */
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  databaseURL: "",
  projectId: "",
  appId: "",
};
function cargarScript(src){ return new Promise((ok, mal) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = mal; document.head.appendChild(s); }); }
async function firebaseDB(){
  const V = "https://www.gstatic.com/firebasejs/10.12.2/";
  for (const f of ["firebase-app-compat.js", "firebase-auth-compat.js", "firebase-database-compat.js"]) await cargarScript(V + f);
  firebase.initializeApp(FIREBASE_CONFIG);
  const cred = firebase.auth().currentUser || await new Promise(ok => { const off = firebase.auth().onAuthStateChanged(u => { off(); ok(u); }); });
  const yo = cred || (await firebase.auth().signInAnonymously()).user;
  const rt = firebase.database();
  // Realtime Database borra los null y los arreglos vacíos: los repongo al leer.
  const norm = v => {
    if (!v) return null;
    const d = {...v};
    if (d.log) d.log = Object.values(d.log).map(e => ({a:null, ...e}));
    if (d.flip) d.flip = Object.values(d.flip);
    return d;
  };
  const snap = (p, v) => ({id:p.split("/").pop(), exists:v != null, data:() => v || undefined, metadata:{fromCache:false, hasPendingWrites:false}});
  const fail = e => { throw {code: /permission/i.test(String(e && (e.code || e.message))) ? "invalid_argument" : "unavailable", message:String(e)}; };
  const doc = p => ({
    id:p.split("/").pop(), path:p,
    get:() => rt.ref(p).get().then(s => snap(p, norm(s.val())), fail),
    set:d => rt.ref(p).set(JSON.parse(JSON.stringify(d))).catch(fail),
    update:async d => { const s = await rt.ref(p).get(); if (!s.exists()) throw {code:"invalid_argument", message:"no existe"}; return rt.ref(p).update(JSON.parse(JSON.stringify(d))).catch(fail); },
    delete:() => rt.ref(p).remove().catch(fail),
    onSnapshot:(next, err) => { const h = s => next(snap(p, norm(s.val()))); rt.ref(p).on("value", h, e => err && err({code:"revoked", message:String(e)})); return () => rt.ref(p).off("value", h); },
  });
  return {db:{doc, collection:c => ({path:c, doc:id => doc(c + "/" + id)})}, uid:yo.uid};
}
let LOCAL_TEST = false, ONLINE_KIND = "claude";

(async () => {
  try {
    const c = window.claude;
    if (c && c.use) { [db, user] = await Promise.all([c.use("db"), c.use("user")]); }
    uid = user ? await user.id() : null;
  } catch (e) {}
  if (!window.claude){
    if (FIREBASE_CONFIG.apiKey){
      ONLINE_KIND = "firebase";
      try { const f = await firebaseDB(); db = f.db; uid = f.uid; } catch (e) { console.error(e); db = null; uid = null; }
    } else if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)){
      ONLINE_KIND = "local"; LOCAL_TEST = true; db = localDB();
      try { uid = sessionStorage.getItem("aep_uid") || ("tab-" + Math.random().toString(36).slice(2, 8)); sessionStorage.setItem("aep_uid", uid); } catch (e) { uid = "tab-" + Math.random().toString(36).slice(2, 8); }
    } else ONLINE_KIND = "none";
  }
  dbState = (db && uid) ? "ok" : "off";
  if (dbState === "ok") { try { const c = localStorage.getItem("aep_code"); if (c) S.resume = c; } catch (e) {} }
  if (S.view === "home") render();
})();

  </section>
  <section class="modes">
    <div class="panel"><h2>En un solo dispositivo</h2>
      <p class="muted">Se pasan el celu o la compu. Una pantalla de pausa tapa el tablero entre turnos para que nadie espíe.</p>
      <button class="btn pri" data-act="local">Jugar acá</button></div>
    <div class="panel"><h2>Online, cada uno en su pantalla</h2>${online}</div>
  </section>`;
}

/* ---------- modo local ---------- */
function newLocal(){ L = {board:sortear(), secret:{1:null,2:null}, flip:{1:[],2:[]}, cur:1, phase:"pick", curtain:true, guessMode:false, sel:null, msg:"", winner:null}; S.view = "local"; render(); }
function localHTML(){
  const c = L.cur;
  if (L.phase === "over"){
    return `<div class="banner"><h1>¡Ganó el Jugador ${L.winner}!</h1>
      <div class="pair">${[1,2].map(n => `<figure><img src="${spr(L.secret[n])}" alt=""><figcaption><b>Jugador ${n}</b><br>${esc(nombre(L.secret[n]))}</figcaption></figure>`).join("")}</div>
      <div class="row"><button class="btn pri" data-act="local">Revancha</button><button class="btn ghost" data-act="home">Menú</button></div></div>`;
  }
  if (L.curtain){
    const txt = L.phase === "pick" ? "Elegí tu Pokémon secreto. Que el otro jugador no mire." : "Es tu turno. Hacé tu pregunta en voz alta y bajá las cartas que descartes.";
    return `<div class="curtain"><p class="px muted" style="font-size:11px">Pasale el dispositivo al</p><h2>Jugador ${c}</h2>
      ${L.msg ? `<p style="font-weight:800">${esc(L.msg)}</p>` : ""}<p>${txt}</p>
      <button class="btn pri" data-act="uncurtain">Soy el Jugador ${c}, mostrar</button>
      <button class="btn ghost" data-act="home">Salir al menú</button></div>`;
  }
  if (L.phase === "pick"){
    return `<div class="status"><span class="chip turn">Jugador ${c}</span><span>Tocá el Pokémon que querés esconder.</span></div>
      ${boardHTML(L.board, id => ({sel: L.sel === id}), "picking")}
      ${L.sel ? `<div class="dock"><div class="row"><span>Tu secreto: <b>${esc(nombre(L.sel))}</b></span><button class="btn pri" data-act="lpick">Confirmar</button></div></div>` : ""}`;
  }
  const flips = L.flip[c], quedan = L.board.length - flips.length;
  const dock = L.guessMode
    ? (L.sel ? `<span>¿Es <b>${esc(nombre(L.sel))}</b>?</span><button class="btn red" data-act="lguess">Sí, adivinar</button><button class="btn ghost" data-act="cancelguess">Cancelar</button>`
             : `<span>Tocá el Pokémon que creés que tiene tu rival.</span><button class="btn ghost" data-act="cancelguess">Cancelar</button>`)
    : `<button class="btn ok" data-act="lend">Terminar turno</button><button class="btn red" data-act="guessmode">Adivinar</button>`;
  return `<div class="status"><span class="chip turn">Turno del Jugador ${c}</span><span class="chip">Te quedan ${quedan} en pie</span><button class="btn ghost" data-act="home">Salir</button></div>
    <div class="play"><div>${boardHTML(L.board, id => ({down: flips.includes(id), sel: L.guessMode && L.sel === id}), L.guessMode ? "guessing" : "")}</div>
    <aside class="side">${mineHTML(L.secret[c])}<div class="panel"><p class="muted">Preguntá en voz alta algo que se responda con sí o no. Tocá una carta para bajarla o volver a levantarla.</p></div></aside></div>
    <div class="dock"><div class="row">${dock}</div></div>`;
}

/* ---------- modo online ---------- */
const gameRef = code => db.doc("games/" + code);
const privRef = code => db.collection("data/users/" + uid).doc("g-" + code);
let wq = Promise.resolve();
function write(fn){ wq = wq.then(fn).catch(e => { console.error(e); toast(e && e.code === "invalid_argument" ? "No tenés permiso para escribir en esta partida." : "No se pudo guardar. Probá de nuevo."); }); return wq; }
function genCode(){ const a = "ABCDEFGHJKLMNPQRSTUVWXYZ"; let s = ""; for (let i = 0; i < 4; i++) s += a[Math.floor(Math.random()*a.length)]; return s; }

async function createOnline(){
  S.busy = true; render();
  try {
    let code;
    for (let i = 0; i < 6; i++){ code = genCode(); const s = await gameRef(code).get(); if (!s.exists) break; }
    await gameRef(code).set({code, board:sortear(), p1:uid, p2:null, ready1:false, ready2:false, turn:1, log:[], winner:null, reveal1:null, reveal2:null, created:Date.now()});
    await enterOnline(code);
  } catch (e) { S.joinErr = e && e.code === "invalid_argument" ? "Tu cuenta no tiene permiso para crear partidas en esta página. Pedile al dueño acceso de Editor." : "No se pudo crear la partida."; }
  S.busy = false; render();
}
async function joinOnline(raw){
  const code = (raw || "").trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(code)){ S.joinErr = "El código tiene 4 letras."; render(); return; }
  S.busy = true; S.joinErr = ""; render();
  try {
    const s = await gameRef(code).get();
    if (!s.exists) S.joinErr = "No encontré la partida " + code + ".";
    else {
      const d = s.data();
      if (d.p1 === uid || d.p2 === uid) await enterOnline(code);
      else if (!d.p2){ await gameRef(code).update({p2:uid}); await enterOnline(code); }
      else S.joinErr = "La partida " + code + " ya tiene dos jugadores.";
    }
  } catch (e) { S.joinErr = e && e.code === "invalid_argument" ? "Tu cuenta no tiene permiso para jugar online en esta página. Pedile al dueño acceso de Editor." : "No se pudo entrar a la partida."; }
  S.busy = false; render();
}
async function enterOnline(code){
  if (O && O.unsub) O.unsub();
  O = {code, g:null, priv:{secret:null, flip:[]}, names:{}, draft:"", guessMode:false, sel:null, done:{}, gone:false};
  try { localStorage.setItem("aep_code", code); } catch (e) {}
  try { const p = await privRef(code).get(); if (p.exists){ const d = p.data(); O.priv = {secret:d.secret ?? null, flip:[...(d.flip || [])]}; } } catch (e) {}
  S.view = "online";
  O.unsub = gameRef(code).onSnapshot(snap => {
    if (!O || O.code !== code) return;
    O.g = snap.exists ? snap.data() : null; O.gone = !snap.exists;
    afterSnap(); render();
  }, err => { if (O) { O.err = "Se perdió la conexión con la partida. Recargá la página."; render(); } });
}
function leaveOnline(){ if (O && O.unsub) O.unsub(); O = null; try { localStorage.removeItem("aep_code"); } catch (e) {} S.resume = null; S.view = "home"; render(); }
const meN = () => !O || !O.g ? 0 : O.g.p1 === uid ? 1 : O.g.p2 === uid ? 2 : 0;
function phaseOf(g){ if (!g) return "loading"; if (g.winner) return "over"; if (!g.p2) return "waiting"; if (!(g.ready1 && g.ready2)) return "choosing"; return "playing"; }
let savePrivT = null;
function savePriv(){ const code = O.code, body = {secret:O.priv.secret, flip:[...O.priv.flip]}; clearTimeout(savePrivT); savePrivT = setTimeout(() => write(() => privRef(code).set(body)), 400); }

function afterSnap(){
  const g = O.g, me = meN(); if (!g || !me) return;
  // nombres de los jugadores
  const ids = [g.p1, g.p2].filter(Boolean);
  if (user && ids.some(id => !(id in O.names))) user.profiles(ids).then(ps => { if (!O) return; ids.forEach(id => O.names[id] = (ps[id] && ps[id].name) || ""); render(); });
  const log = g.log || [], last = log[log.length - 1], idx = log.length - 1;
  // el rival arriesgó: lo resuelve el dueño del secreto
  if (last && last.k === "g" && last.a === null && last.by !== me && O.priv.secret && !O.done["g" + idx]){
    O.done["g" + idx] = true;
    const ok = last.id === O.priv.secret, nl = log.map((e, i) => i === idx ? {...e, a:ok} : e);
    const upd = ok ? {log:nl, winner:last.by, ["reveal" + me]:O.priv.secret} : {log:nl, turn:me};
    write(() => gameRef(O.code).update(upd));
  }
  // mi intento fallido: bajo esa carta
  if (last && last.k === "g" && last.by === me && last.a === false && !O.priv.flip.includes(last.id) && !O.done["f" + idx]){
    O.done["f" + idx] = true; O.priv.flip.push(last.id); savePriv();
  }
  // fin: muestro mi secreto
  if (g.winner && !g["reveal" + me] && O.priv.secret && !O.done.rev){ O.done.rev = true; write(() => gameRef(O.code).update({["reveal" + me]:O.priv.secret})); }
}
function who(n){ const me = meN(); if (n === me) return "Vos"; const id = O.g["p" + n]; return (id && O.names[id]) || "Tu rival"; }

function onlineHTML(){
  if (O.err) return `<div class="banner"><p class="err">${esc(O.err)}</p><button class="btn ghost" data-act="leave">Volver al menú</button></div>`;
  if (O.gone) return `<div class="banner"><p>La partida ${esc(O.code)} ya no existe.</p><button class="btn ghost" data-act="leave">Volver al menú</button></div>`;
  const g = O.g; if (!g) return `<div class="banner"><p class="muted">Cargando partida…</p></div>`;
  const me = meN(); if (!me) return `<div class="banner"><p>No sos parte de la partida ${esc(O.code)}.</p><button class="btn ghost" data-act="leave">Volver al menú</button></div>`;
  const ph = phaseOf(g), riv = otro(me), log = g.log || [], last = log[log.length - 1];
  const pending = last && last.a === null;
  const myTurn = ph === "playing" && g.turn === me && !pending;
  const top = `<div class="status"><div class="row"><span class="muted">Partida</span><span class="code">${esc(O.code)}</span><button class="btn ghost" data-act="copy" style="padding:6px 10px">Copiar código</button></div>
    <div class="row">${ph === "playing" ? `<span class="chip ${myTurn ? "turn" : ""}">${myTurn ? "Tu turno" : pending ? (last.by === me ? "Esperando respuesta" : "Te toca responder") : "Turno de " + esc(who(riv))}</span>` : ""}
    <button class="btn ghost" data-act="leave">Salir</button></div></div>`;

  if (ph === "waiting") return top + `<div class="curtain"><p class="px muted" style="font-size:11px">Pasale este código a tu amigo</p><h2 class="code" style="font-size:clamp(28px,8vw,48px)">${esc(O.code)}</h2><p>Él abre esta misma página, toca «Unirme» y escribe el código. La partida arranca sola cuando entra.</p></div>`;

  if (ph === "choosing"){
    if (!g["ready" + me]) return top + `<div class="status"><span class="chip turn">Elegí tu Pokémon secreto</span><span class="muted">${g["ready" + riv] ? esc(who(riv)) + " ya eligió." : esc(who(riv)) + " también está eligiendo."}</span></div>
      ${boardHTML(g.board, id => ({sel: O.sel === id}), "picking")}
      ${O.sel ? `<div class="dock"><div class="row"><span>Tu secreto: <b>${esc(nombre(O.sel))}</b></span><button class="btn pri" data-act="opick">Confirmar</button></div></div>` : ""}`;
    return top + `<div class="curtain"><h2>¡Listo!</h2>${mineHTML(O.priv.secret)}<p>Esperando que ${esc(who(riv))} elija su Pokémon…</p></div>`;
  }

  if (ph === "over"){
    const gane = g.winner === me, mio = g["reveal" + me] || O.priv.secret, suyo = g["reveal" + riv];
    return top + `<div class="banner"><h1>${gane ? "¡Ganaste!" : "Ganó " + esc(who(riv))}</h1>
      <div class="pair">${[[me, mio], [riv, suyo]].map(([n, id]) => `<figure>${id ? `<img src="${spr(id)}" alt="">` : `<div style="width:112px;height:112px;border-radius:14px;background:var(--line)"></div>`}<figcaption><b>${esc(who(n))}</b><br>${id ? esc(nombre(id)) : "…"}</figcaption></figure>`).join("")}</div>
      <div class="row"><button class="btn pri" data-act="create">Nueva partida</button><button class="btn ghost" data-act="leave">Menú</button></div></div>`;
  }

  // jugando
  const quedan = g.board.length - O.priv.flip.length;
  const tiposEnTablero = [...new Set(g.board.flatMap(id => BY[id].t))].sort((a, b) => TIPOS[a].localeCompare(TIPOS[b]));
  let action = "";
  if (pending && last.by !== me && last.k === "q"){
    action = `<div class="panel ask"><p class="muted">${esc(who(riv))} pregunta:</p><p class="q">${esc(last.t)}</p><p class="muted">Tu Pokémon es <b>${esc(nombre(O.priv.secret))}</b>.</p>
      <div class="row"><button class="btn ok" data-act="ans" data-v="1">Sí</button><button class="btn red" data-act="ans" data-v="0">No</button></div></div>`;
  } else if (pending && last.by === me){
    action = `<div class="panel"><p class="muted">Esperando que ${esc(who(riv))} responda…</p></div>`;
  } else if (myTurn){
    action = `<div class="panel"><h2>Tu pregunta</h2>
      <div class="row"><input type="text" id="q" maxlength="140" placeholder="¿Es de color amarillo?" value="${esc(O.draft)}" aria-label="Pregunta"></div>
      <div class="row"><select id="qtype" aria-label="Preguntar por tipo"><option value="">Preguntar por tipo…</option>${tiposEnTablero.map(t => `<option value="${t}">${TIPOS[t]}</option>`).join("")}</select>
      <button class="btn pri" data-act="ask">Preguntar</button></div>
      <button class="btn red" data-act="guessmode">Adivinar</button></div>`;
  } else {
    action = `<div class="panel"><p class="muted">Le toca preguntar a ${esc(who(riv))}.</p></div>`;
  }
  const items = log.slice(-12).map(e => {
    const a = e.a === null ? `<span class="ans w">…</span>` : e.k === "g" ? `<span class="ans ${e.a ? "y" : "n"}">${e.a ? "¡Era!" : "No era"}</span>` : `<span class="ans ${e.a ? "y" : "n"}">${e.a ? "Sí" : "No"}</span>`;
    const txt = e.k === "g" ? "arriesgó <b>" + esc(nombre(e.id)) + "</b>" : esc(e.t);
    return `<li><span><span class="who">${esc(who(e.by))}</span>${txt}</span>${a}</li>`;
  }).join("");
  const dock = O.guessMode ? `<div class="dock"><div class="row">${O.sel
      ? `<span>¿Es <b>${esc(nombre(O.sel))}</b>?</span><button class="btn red" data-act="oguess">Sí, adivinar</button><button class="btn ghost" data-act="cancelguess">Cancelar</button>`
      : `<span>Tocá el Pokémon que creés que tiene ${esc(who(riv))}.</span><button class="btn ghost" data-act="cancelguess">Cancelar</button>`}</div></div>` : "";
  return top + `<div class="play"><div>${boardHTML(g.board, id => ({down: O.priv.flip.includes(id), sel: O.guessMode && O.sel === id}), O.guessMode ? "guessing" : "")}
      <p class="muted" style="margin-top:10px">Te quedan ${quedan} en pie. Tocá una carta para bajarla o levantarla.</p></div>
    <aside class="side">${action}${mineHTML(O.priv.secret)}
      <div class="panel"><h2>Preguntas</h2>${items ? `<ul class="log">${items}</ul>` : `<p class="muted">Todavía nadie preguntó nada.</p>`}</div></aside></div>${dock}`;
}

/* ---------- render y eventos ---------- */
function render(){
  const a = document.activeElement, fid = a && a.id, s0 = a && a.selectionStart, s1 = a && a.selectionEnd;
  $app.innerHTML = S.view === "local" ? localHTML() : S.view === "online" && O ? onlineHTML() : homeHTML();
  if (fid){ const n = document.getElementById(fid); if (n && n.focus){ n.focus(); try { n.setSelectionRange(s0, s1); } catch (e) {} } }
  if (genPend.size) cargarSprites();
}

$app.addEventListener("input", e => { if (e.target.id === "q" && O) O.draft = e.target.value; });
$app.addEventListener("change", e => {
  if (e.target.id === "qtype" && O && e.target.value){ O.draft = "¿Es de tipo " + TIPOS[e.target.value] + "?"; render(); }
});
$app.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "joincode") joinOnline(e.target.value);
  if (e.target.id === "q") act("ask");
});
$app.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  act(t.dataset.act, t);
});

function act(a, t){
  const id = t && t.dataset.id ? +t.dataset.id : null;
  switch (a){
    case "home": if (O) return leaveOnline(); S.view = "home"; L = null; render(); break;
    case "local": newLocal(); break;
    case "gen": case "gens-all": case "gens-none": {
      if (a === "gens-all") gens = GENS.map(g => g.n);
      else if (a === "gens-none") gens = [1];
      else {
        const n = +t.dataset.g;
        if (gens.includes(n)){ if (gens.length === 1){ toast("Tiene que quedar al menos una generación."); return; } gens = gens.filter(x => x !== n); }
        else gens = [...gens, n].sort((x, y) => x - y);
      }
      try { localStorage.setItem("aep_gens", JSON.stringify(gens)); } catch (e) {}
      render(); break;
    }
    case "create": createOnline(); break;
    case "join": joinOnline((document.getElementById("joincode") || {}).value); break;
    case "resume": S.busy = true; render(); joinOnline(S.resume).then(() => { if (S.view === "home"){ S.resume = null; try { localStorage.removeItem("aep_code"); } catch (e) {} render(); } }); break;
    case "leave": leaveOnline(); break;
    case "copy": {
      const code = O.code;
      Promise.resolve().then(() => navigator.clipboard.writeText(code)).then(() => toast("Código copiado: " + code), () => toast("Copiá el código a mano: " + code));
      break;
    }
    case "uncurtain": L.curtain = false; L.msg = ""; L.sel = null; render(); break;
    case "card": onCard(id); break;
    case "lpick":
      L.secret[L.cur] = L.sel; L.sel = null;
      if (L.cur === 1){ L.cur = 2; } else { L.cur = 1; L.phase = "play"; }
      L.curtain = true; render(); break;
    case "lend": L.cur = otro(L.cur); L.curtain = true; L.guessMode = false; L.sel = null; render(); window.scrollTo(0, 0); break;
    case "guessmode": if (S.view === "local"){ L.guessMode = true; L.sel = null; } else { O.guessMode = true; O.sel = null; } render(); break;
    case "cancelguess": if (S.view === "local"){ L.guessMode = false; L.sel = null; } else { O.guessMode = false; O.sel = null; } render(); break;
    case "lguess": {
      const g = L.sel, c = L.cur; L.guessMode = false; L.sel = null;
      if (g === L.secret[otro(c)]){ L.winner = c; L.phase = "over"; }
      else { if (!L.flip[c].includes(g)) L.flip[c].push(g); L.msg = "El Jugador " + c + " arriesgó " + nombre(g) + " y no era. Pierde el turno."; L.cur = otro(c); L.curtain = true; }
      render(); window.scrollTo(0, 0); break;
    }
    case "opick": {
      const me = meN(), sel = O.sel, code = O.code; if (!sel) return;
      O.priv = {secret:sel, flip:[]}; O.sel = null;
      write(() => privRef(code).set({secret:sel, flip:[]})).then(() => write(() => gameRef(code).update({["ready" + me]:true})));
      render(); break;
    }
    case "ask": {
      const txt = (O.draft || "").trim(); if (!txt){ toast("Escribí una pregunta primero."); return; }
      const g = O.g, me = meN(); if (g.turn !== me) return;
      O.draft = "";
      write(() => gameRef(O.code).update({log:[...(g.log || []), {by:me, k:"q", t:txt.slice(0, 140), a:null}]}));
      render(); break;
    }
    case "ans": {
      const g = O.g, me = meN(), log = g.log || [], i = log.length - 1;
      if (!log[i] || log[i].a !== null || log[i].by === me) return;
      const nl = log.map((e, j) => j === i ? {...e, a: t.dataset.v === "1"} : e);
      write(() => gameRef(O.code).update({log:nl, turn:me})); break;
    }
    case "oguess": {
      const g = O.g, me = meN(), sel = O.sel; if (!sel || g.turn !== me) return;
      O.guessMode = false; O.sel = null;
      write(() => gameRef(O.code).update({log:[...(g.log || []), {by:me, k:"g", id:sel, a:null}]}));
      render(); break;
    }
  }
}

function onCard(id){
  if (S.view === "local"){
    if (L.phase === "pick" || L.guessMode){ if (L.guessMode && L.flip[L.cur].includes(id)) return; L.sel = id; render(); return; }
    if (L.phase !== "play") return;
    const f = L.flip[L.cur], i = f.indexOf(id); i >= 0 ? f.splice(i, 1) : f.push(id); render(); return;
  }
  if (!O || !O.g) return;
  const ph = phaseOf(O.g);
  if (ph === "choosing" && !O.g["ready" + meN()]){ O.sel = id; render(); return; }
  if (ph !== "playing") return;
  if (O.guessMode){ if (!O.priv.flip.includes(id)) { O.sel = id; render(); } return; }
  const f = O.priv.flip, i = f.indexOf(id); i >= 0 ? f.splice(i, 1) : f.push(id);
  savePriv(); render();
}

render();
</script>
